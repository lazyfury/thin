[package]
name = "spacekit"
version = "0.1.0"
edition = "2024"
description = "macOS 系统空间扫描与安全清理 CLI (M0)"

[[bin]]
name = "spacekit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
