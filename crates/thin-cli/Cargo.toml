[package]
name = "thin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "thin 命令行与 TUI 前端"

[[bin]]
name = "thin"
path = "src/main.rs"

[dependencies]
thin-core = { path = "../thin-core" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
unicode-width = "0.2"

[features]
default = []
# 启用 thin-fs 的 macOS getattrlistbulk 批量遍历后端（可选）
native = ["thin-core/native"]
